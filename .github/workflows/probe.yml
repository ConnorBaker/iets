name: thread-cpu-probe
on:
  push:
    branches: [ci-probe-thread-cpu-time]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: bash
        run: rustc -O probe.rs && ls -la probe*
      - name: probe (1000 sleeps of 50 ms, twice)
        shell: bash
        run: ./probe 1000
