name: windows-clone-lock-research
on:
  push:
    branches: [research/windows-clone-lock-20261120]
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.os }}-${{ matrix.source }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-latest, windows-11-arm]
        source: [control, diagnostic]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'control' && '9157ca1a2a50c085bcd7fd0004d9ba71e2b7c1e0' || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Freeze source and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force receipts | Out-Null
          git rev-parse HEAD | Out-File receipts/source.txt
          git hash-object src/cachefs.rs src/sys/fs_windows.rs | Out-File receipts/blobs.txt
          rustc -vV | Out-File receipts/rustc.txt
          cargo test --locked --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One complete upstream Windows test command
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors,TotalPhysicalMemory | ConvertTo-Json | Out-File receipts/host.json
          cargo nextest run --locked --no-fail-fast *> receipts/full-nextest.log
          @{case='full-nextest'; exit=$LASTEXITCODE} | ConvertTo-Json | Out-File receipts/results.json
          Get-Content receipts/results.json
          # Diagnostic completion records failures; this is not a green product check.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clone-lock-${{ matrix.os }}-${{ matrix.source }}
          path: receipts
